name: Build dae dat files

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -v
      - name: Generate dat files
        run: python -m surge_dae_dat build --output-dir dist
      - name: Upload dat files to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            r2 object put "${{ secrets.R2_BUCKET_NAME }}/dae-dat/surge-geosite.dat" --file=dist/surge-geosite.dat --remote --content-type=application/octet-stream --cache-control="public, max-age=300, must-revalidate"
            r2 object put "${{ secrets.R2_BUCKET_NAME }}/dae-dat/surge-geoip.dat" --file=dist/surge-geoip.dat --remote --content-type=application/octet-stream --cache-control="public, max-age=300, must-revalidate"
            r2 object put "${{ secrets.R2_BUCKET_NAME }}/dae-dat/manifest.json" --file=dist/manifest.json --remote --content-type=application/json --cache-control="public, max-age=300, must-revalidate"
